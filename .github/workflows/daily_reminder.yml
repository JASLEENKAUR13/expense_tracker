name: Daily Reminder

on:
  schedule:
    - cron: '30 * * * *'  # runs every hour at :30
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Send Reminders
        run: |
          cat << 'EOF' > script.mjs
          const SUPABASE_URL = process.env.SUPABASE_URL;
          const SUPABASE_KEY = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const ONESIGNAL_APP_ID = process.env.ONESIGNAL_APP_ID;
          const ONESIGNAL_REST_API_KEY = process.env.ONESIGNAL_REST_API_KEY;

          // Get current UTC time and convert to IST
          const now = new Date();
          const istOffset = 5.5 * 60 * 60 * 1000;
          const istTime = new Date(now.getTime() + istOffset);
          const currentHour = istTime.getUTCHours().toString().padStart(2, '0');
          const currentMin = istTime.getUTCMinutes().toString().padStart(2, '0');
          const currentTime = `${currentHour}:${currentMin}:00`;

          console.log(`Running for IST time: ${currentTime}`);

          // Fetch users whose reminder_time matches current time
          const res = await fetch(`${SUPABASE_URL}/rest/v1/profiles?reminder_time=eq.${currentTime}&select=user_id,user_name,onesignal_player_id`, {
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`
            }
          });

          const users = await res.json();
          console.log(`Found ${users.length} users to remind`);

          for (const user of users) {
            if (!user.onesignal_player_id) continue;

            const notifRes = await fetch('https://onesignal.com/api/v1/notifications', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Basic ${ONESIGNAL_REST_API_KEY}`
              },
              body: JSON.stringify({
                app_id: ONESIGNAL_APP_ID,
                include_player_ids: [user.onesignal_player_id],
                headings: { en: "Expenso 💰" },
                contents: { en: `Hey ${user.user_name?.split(' ')[0] || 'there'}! Don't forget to log your expenses today.` }
              })
            });

            const notifData = await notifRes.json();
            console.log(`Sent to ${user.user_name}: ${JSON.stringify(notifData)}`);
          }
          EOF
          node script.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
